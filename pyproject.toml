[project]
name = "orion-backend"
version = "1.0.0"
description = "Orion - KSM AIoT Management & Portal Backend API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "alembic-postgresql-enum>=1.11.1",
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.162.4",
    "pydantic[email]>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "python-multipart>=0.0.33",
    "defusedxml>=0.7.1",
]

[tool.uv]
exclude-newer-package = { fastapi = "2026-11-11T23:59:59Z" }

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
ignore = ["B008", "DTZ005"]
