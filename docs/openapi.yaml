  /webhooks/payments/{provider}:
    post:
      tags:
      - Webhook
      summary: 'Webhook: notifikasi pembayaran dari payment gateway'
      x-orion-status: PERLU-DISKUSI
      x-orion-requirements: FR-FIN-10
      x-orion-roles: Penyedia pembayaran (tanpa JWT; signature wajib)
      description: '**Status:** [PERLU-DISKUSI] · Verifikasi signature sesuai penyedia sebelum memproses; idempoten berdasarkan
        `(provider, event_id)`; balas 200 cepat lalu proses; penyedia mengulang pengiriman bila non-2xx.'
      security: []
      parameters:
      - name: provider
        in: path
        required: true
        description: midtrans | xendit | ...
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhook'
      responses:
        '200':
          description: Diterima (termasuk event duplikat)
        '401':
          description: Signature tidak valid
          content:
            application/json:
              schema: *id001
        '422':
          description: Payload tidak dikenali
          content:
            application/json:
              schema: *id001
      operationId: postWebhooksPaymentsProvider
